runConfig:
  runtime: nodejs22
  concurrency: 80
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 2

env:
  # Node's default 512 KiB body limit is below the handoff's 1 MiB limit and the
  # assistant share's 64 MiB limit. Leave room for each endpoint to count bytes
  # and return its own 413; both reject oversize bodies before parsing.
  - variable: BODY_SIZE_LIMIT
    value: 68M
    availability:
      - RUNTIME
  # Quota endpoint for iPhone and sibling-planner link sharing; since the
  # Storage rules cutover it is the only way captures reach the bucket (issue #30).
  - variable: HANDOFF_UPLOADS_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: HANDOFF_BUCKET
    value: openplan3d.firebasestorage.app
    availability:
      - RUNTIME
  # Assistant shares (docs/assistant-shares.md). The 7-day assistant-shares/
  # lifecycle rule was applied to the bucket on September 16, 2026.
  - variable: ASSISTANT_SHARES_ENABLED
    value: "true"
    availability:
      - RUNTIME
  - variable: NODE_ENV
    value: production
    availability:
      - RUNTIME
      - BUILD
  # Install the compiler/tooling without compiling a development-mode application.
  - variable: NPM_CONFIG_INCLUDE
    value: dev
    availability:
      - BUILD
