name: Web checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - run: npm run catalog:check
      - run: npm audit --audit-level=high --omit dev
      - run: npm audit --audit-level=high
        continue-on-error: true
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Production build for all browser engines
        uses: actions/upload-artifact@v7
        with:
          name: browser-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        # Each engine has hundreds of cases; keep the complete suite within
        # the existing per-job limit without dropping tests or assertions.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Chromium and WebKit regressions
        if: matrix.browser != 'firefox'
        run: npm run test:browser -- --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/6
      - name: Firefox regressions with a virtual display for WebGL
        if: matrix.browser == 'firefox'
        run: xvfb-run -a npm run test:browser -- --project=firefox --headed --shard=${{ matrix.shard }}/6
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
      - name: Browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks-${{ matrix.browser }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [desktop, phone-viewport]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          NODE_ENV: production
          NPM_CONFIG_INCLUDE: dev
      - uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: build/
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:viewer -- --project=${{ matrix.profile }}
      - name: Rendering measurements and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: rendering-benchmarks-${{ matrix.profile }}
          path: benchmark-results/
          retention-days: 3

  # Keep the existing check name as an aggregate gate: success includes every
  # engine, and a failed/skipped dependency must not silently pass this job.
  check:
    if: ${{ always() }}
    needs: [build, browser, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require build and all browser checks
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
        run: test "$BUILD_RESULT" = success && test "$BROWSER_RESULT" = success && test "$BENCHMARK_RESULT" = success

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    needs:
      - build
      - browser
      - benchmark
      - check

    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: browser-build
          path: build/

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=edge,branch=main
            type=ref,event=pr

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        id: build-and-push
        with:
          context: .
          file: ./.github/github.dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # This step generates an artifact attestation for the image, which is an
      # unforgeable statement about where and how it was built. It increases
      # supply chain security for people who consume the image.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true
